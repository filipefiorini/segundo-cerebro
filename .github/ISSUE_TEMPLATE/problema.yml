name: Problema
description: Algo no framework não funciona como deveria.
title: "Problema: "
labels: ["problema"]
body:
  - type: markdown
    attributes:
      value: |
        Esta página é pública. Não cole dado pessoal nem conteúdo das suas notas.
  - type: input
    id: versao
    attributes:
      label: Versão
      description: Conteúdo do arquivo `.segundo-cerebro-version`.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava
    validations:
      required: true
  - type: textarea
    id: ocorreu
    attributes:
      label: O que aconteceu
      description: Passos para repetir e, se houver, a mensagem de erro (sem nomes ou caminhos pessoais).
    validations:
      required: true
